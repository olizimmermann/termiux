name: Termiux
options:
  bundleIdPrefix: com.ozimmermann
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TermiuxCore:
    path: Packages/TermiuxCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.0
targetTemplates:
  TermiuxApp:
    type: application
    platform: macOS
    sources: [Termiux/Sources]
    dependencies:
      - package: TermiuxCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozimmermann.termiux
        PRODUCT_NAME: Termiux
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Termiux
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
targets:
  # Notarized direct download: local shell, ~/.ssh, ssh-agent.
  Termiux:
    templates: [TermiuxApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Termiux/Config/Direct.entitlements
  # Mac App Store: sandboxed, features that need the sandbox lifted are compiled out.
  TermiuxAppStore:
    templates: [TermiuxApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Termiux/Config/AppStore.entitlements
        PRODUCT_NAME: Termiux AppStore
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SANDBOXED"
  TermiuxTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TermiuxTests]
    dependencies:
      - target: Termiux
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Termiux.app/Contents/MacOS/Termiux"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Termiux:
    build:
      targets:
        Termiux: all
    test:
      targets: [TermiuxTests]
  TermiuxAppStore:
    build:
      targets:
        TermiuxAppStore: all
